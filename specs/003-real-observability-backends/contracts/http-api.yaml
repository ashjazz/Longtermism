openapi: 3.1.0
info:
  title: Longtermism Real Observability Slice API
  version: 0.1.0
  description: Minimal non-streaming chat and infrastructure-only smoke contracts for spec 003.
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/v1/chat:
    post:
      summary: Run one server-configured non-streaming AI chat
      operationId: chat
      description: >-
        Ordinary callers send no smoke headers. A live smoke runner may send both protected
        headers below only from a loopback connection while observability.smoke.enabled is true.
        The server authenticates the short-lived shared admission secret and atomically consumes
        the one-time run marker before accepting it; every rejection happens before the usecase.
      parameters:
        - name: X-Observability-Smoke-Run-ID
          in: header
          required: false
          description: >-
            Low-sensitive runner-owned marker. Supplying either smoke header opts this request
            into protected smoke admission; it is never returned in the public chat envelope.
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]+$'
        - name: X-Observability-Smoke-Authorization
          in: header
          required: false
          description: >-
            Independent short-lived shared admission secret. Its value is removed at admission
            and never enters a DTO, command, span, log, metric, manifest, report or error.
          schema:
            type: string
            minLength: 16
            maxLength: 512
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Chat completed
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSuccessEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /api/v1/observability/infra-smoke:
    get:
      summary: Emit infrastructure-only observability facts
      description: Returns 404 when observability.smoke.enabled is false. It never creates an AI trace.
      operationId: infraSmoke
      parameters:
        - name: X-Observability-Smoke-Run-ID
          in: header
          required: false
          description: Low-sensitive opaque run marker generated by the smoke runner.
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]+$'
      responses:
        '200':
          description: Infrastructure facts emitted
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfraSmokeSuccessEnvelope'
        '404':
          description: Smoke endpoint disabled
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  responses:
    BadRequest:
      description: Invalid request
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatPreAIErrorEnvelope'
    RateLimited:
      description: Request rejected by a local pre-AI limit or by the configured model service after AI identity creation
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ChatPreAIErrorEnvelope'
              - $ref: '#/components/schemas/ChatPostAIErrorEnvelope'
    UpstreamFailure:
      description: Configured model service failed
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatPostAIErrorEnvelope'
    UpstreamTimeout:
      description: Configured model service timed out
      headers:
        X-Request-ID:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChatPostAIErrorEnvelope'
  schemas:
    ChatRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 32768
          x-longtermism-max-utf8-bytes: 32768
          description: One UTF-8 user message. It must be non-blank after trimming and at most 32768 UTF-8 encoded bytes. Provider, model, base URL and credentials are server-controlled.
    UsageSummary:
      type: object
      additionalProperties: false
      required: [input_tokens, output_tokens, total_tokens]
      properties:
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        reasoning_tokens: { type: integer, minimum: 0 }
        cache_read_tokens: { type: integer, minimum: 0 }
        cache_write_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
    ChatData:
      type: object
      additionalProperties: false
      required: [content, model, finish_reason, usage]
      properties:
        content: { type: string }
        model: { type: string }
        finish_reason:
          type: string
          enum: [stop, length, tool_calls, content_filter]
        usage:
          $ref: '#/components/schemas/UsageSummary'
    EvalSummary:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [passed, warning, failed, not_run]
        evaluator: { type: string }
        score: { type: number, minimum: 0, maximum: 1 }
        reason_class: { type: string }
      x-longtermism-max-serialized-bytes: 1024
      description: Debug-only, low-sensitive and serialized to no more than 1024 UTF-8 bytes.
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: { type: string }
        ai_trace_id: { type: string }
        smoke_run_id: { type: string }
        eval_summary:
          $ref: '#/components/schemas/EvalSummary'
    ChatSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code: { type: integer, const: 0 }
        message: { type: string }
        data:
          $ref: '#/components/schemas/ChatData'
        meta:
          $ref: '#/components/schemas/ChatSuccessMeta'
    ChatSuccessMeta:
      type: object
      additionalProperties: false
      required: [request_id, ai_trace_id]
      properties:
        request_id: { type: string }
        ai_trace_id: { type: string }
        eval_summary:
          $ref: '#/components/schemas/EvalSummary'
      description: >-
        eval_summary is debug-only. smoke_run_id, service_trace_id, span_id and smoke
        authorization are never part of public chat metadata; native OTel identity is handed to
        the local runner only through the protected run manifest.
    ChatPreAIErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code: { type: integer, enum: [400, 429] }
        message: { type: string }
        data: { type: 'null' }
        meta:
          $ref: '#/components/schemas/ChatPreAIErrorMeta'
      description: Input and local rate-limit failures occur before the AI usecase and cannot have an AI identity.
    ChatPreAIErrorMeta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id: { type: string }
    ChatPostAIErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code: { type: integer, enum: [429, 502, 504] }
        message: { type: string }
        data: { type: 'null' }
        meta:
          $ref: '#/components/schemas/ChatPostAIErrorMeta'
      description: Upstream failures and provider-side rate limits occur after the AI usecase begins and retain its identity.
    ChatPostAIErrorMeta:
      type: object
      additionalProperties: false
      required: [request_id, ai_trace_id]
      properties:
        request_id: { type: string }
        ai_trace_id: { type: string }
    InfraSmokeData:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, const: ok }
    InfraSmokeSuccessEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code: { type: integer, const: 0 }
        message: { type: string }
        data:
          $ref: '#/components/schemas/InfraSmokeData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      description: meta.ai_trace_id and meta.eval_summary must be absent.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, meta]
      properties:
        code: { type: integer, minimum: 1 }
        message: { type: string }
        data: { type: 'null' }
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      description: Chat errors retain ai_trace_id once the AI usecase has started.
