apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        # trace_id is structured metadata, not a Loki index label. This link preserves Tempo
        # correlation without moving request-level identity into Prometheus or Loki labels.
        - name: TraceID
          # The dashboard renders structured trace_id metadata into the log line with
          # LogQL line_format, so the derived field can safely extract only that ID.
          matcherRegex: '([a-f0-9]{32})'
          url: '${__value.raw}'
          datasourceUid: tempo
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        tags:
          - key: trace_id
            value: '${__trace.traceId}'
        filterByTraceID: true
        filterBySpanID: false
