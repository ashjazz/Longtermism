# Grafana 主线只承载观测基础设施：应用进程仍只向 collector 发送 OTLP，不能把
# 任一 backend endpoint 或数据库 volume 混入应用配置。所有公开端口限定 loopback，
# 使本地学习环境不会意外暴露到局域网。
x-observability-budget:
  cpus: "8"
  memory: "12GiB"
  volumes: "20GiB"

services:
  # Collector image is intentionally shell-less and runs non-root. This bounded
  # one-shot job owns the only privileged filesystem action: initialize exactly
  # the persistent queue directories and hand them to the Collector UID/GID.
  collector-storage-init:
    image: ${COLLECTOR_STORAGE_INIT_IMAGE}
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    # DAC_OVERRIDE is required only to make a repeated bootstrap idempotent
    # after the queue directories have been handed to UID 10001 with mode 0750.
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    environment:
      OBSERVABILITY_LOG_GID: ${OBSERVABILITY_LOG_GID:?set OBSERVABILITY_LOG_GID}
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mkdir -p /var/lib/otelcol/storage/queue/tempo /var/lib/otelcol/storage/queue/loki /var/lib/otelcol/storage/queue/langfuse /var/lib/otelcol/storage/queue/tempo-compaction /var/lib/otelcol/storage/queue/loki-compaction /var/lib/otelcol/storage/queue/langfuse-compaction;
        chown 10001:"$${OBSERVABILITY_LOG_GID}" /var/lib/otelcol/storage/queue /var/lib/otelcol/storage/queue/tempo /var/lib/otelcol/storage/queue/loki /var/lib/otelcol/storage/queue/langfuse /var/lib/otelcol/storage/queue/tempo-compaction /var/lib/otelcol/storage/queue/loki-compaction /var/lib/otelcol/storage/queue/langfuse-compaction;
        chmod 0750 /var/lib/otelcol/storage/queue /var/lib/otelcol/storage/queue/tempo /var/lib/otelcol/storage/queue/loki /var/lib/otelcol/storage/queue/langfuse /var/lib/otelcol/storage/queue/tempo-compaction /var/lib/otelcol/storage/queue/loki-compaction /var/lib/otelcol/storage/queue/langfuse-compaction
    volumes:
      - type: volume
        source: collector-data
        target: /var/lib/otelcol/storage
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64MiB

  collector:
    image: ${OTELCOL_CONTRIB_IMAGE}
    # 保持非 root UID；补充宿主机当前主组，使 filelog 能以只读方式读取 0640 JSONL。
    user: "10001:${OBSERVABILITY_LOG_GID:?set OBSERVABILITY_LOG_GID}"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      LANGFUSE_OTLP_AUTHORIZATION: ${LANGFUSE_OTLP_AUTHORIZATION:?set LANGFUSE_OTLP_AUTHORIZATION}
      LANGFUSE_OTEL_INGESTION_VERSION: ${LANGFUSE_OTEL_INGESTION_VERSION:?set LANGFUSE_OTEL_INGESTION_VERSION}
    depends_on:
      collector-storage-init:
        condition: service_completed_successfully
    ports:
      # 本地应用运行在宿主机时也只能通过 loopback 进入 Collector；业务进程绝不
      # 直接认识 Tempo/Loki/Prometheus/Grafana/Langfuse 地址。
      - host_ip: 127.0.0.1
        target: 4317
        published: 4317
      - host_ip: 127.0.0.1
        target: 4318
        published: 4318
      - host_ip: 127.0.0.1
        target: 13133
        published: 13133
      - host_ip: 127.0.0.1
        target: 8888
        published: 8888
    volumes:
      - type: bind
        source: ./collector/collector-grafana.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
      # 宿主机应用写入项目内 ignored JSONL；Collector 只从挂载后的固定路径读取。
      - type: bind
        source: ../../resource/log/observability
        target: /var/log/longtermism
        read_only: true
      - type: volume
        source: collector-data
        target: /var/lib/otelcol/storage
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512MiB

  # The Collector image is distroless, so a CMD-SHELL probe inside it can never
  # run. Keep readiness semantic by probing the real health endpoint from a
  # separate non-root utility container on the same Compose network.
  collector-health-probe:
    image: ${COLLECTOR_STORAGE_INIT_IMAGE}
    user: "65534:65534"
    command: ["tail", "-f", "/dev/null"]
    read_only: true
    cap_drop: [ALL]
    depends_on:
      collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://collector:13133/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64MiB

  loki-health-probe:
    image: ${COLLECTOR_STORAGE_INIT_IMAGE}
    user: "65534:65534"
    command: ["tail", "-f", "/dev/null"]
    read_only: true
    cap_drop: [ALL]
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://loki:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64MiB

  tempo-health-probe:
    image: ${COLLECTOR_STORAGE_INIT_IMAGE}
    user: "65534:65534"
    command: ["tail", "-f", "/dev/null"]
    read_only: true
    cap_drop: [ALL]
    depends_on:
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://tempo:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 64MiB

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    ports:
      - host_ip: 127.0.0.1
        target: 9090
        published: 9090
    volumes:
      - type: bind
        source: ./prometheus/prometheus.yaml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: volume
        source: prometheus-data
        target: /prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --output-document=/dev/null http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1GiB

  loki:
    image: ${LOKI_IMAGE}
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - host_ip: 127.0.0.1
        target: 3100
        published: 3100
    volumes:
      - type: bind
        source: ./loki/loki.yaml
        target: /etc/loki/loki.yaml
        read_only: true
      - type: volume
        source: loki-data
        target: /loki
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1GiB

  tempo:
    image: ${TEMPO_IMAGE}
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - host_ip: 127.0.0.1
        target: 3200
        published: 3200
    volumes:
      - type: bind
        source: ./tempo/tempo.yaml
        target: /etc/tempo/tempo.yaml
        read_only: true
      - type: volume
        source: tempo-data
        target: /var/tempo
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1GiB

  grafana:
    image: ${GRAFANA_IMAGE}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    ports:
      - host_ip: 127.0.0.1
        target: 3000
        published: 3000
    volumes:
      - type: bind
        source: ./grafana/provisioning/datasources.yaml
        target: /etc/grafana/provisioning/datasources/datasources.yaml
        read_only: true
      - type: bind
        source: ./grafana/provisioning/dashboards.yaml
        target: /etc/grafana/provisioning/dashboards/dashboards.yaml
        read_only: true
      - type: bind
        source: ./grafana/dashboards/observability-overview.json
        target: /var/lib/grafana/dashboards/observability-overview.json
        read_only: true
      - type: bind
        source: ./grafana/alerts/observability.rules.yaml
        target: /etc/grafana/provisioning/alerting/observability.rules.yaml
        read_only: true
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512MiB

volumes:
  collector-data: {}
  tempo-data: {}
  loki-data: {}
  prometheus-data: {}
  grafana-data: {}
