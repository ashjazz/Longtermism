# Grafana 主线只承载观测基础设施：应用进程仍只向 collector 发送 OTLP，不能把
# 任一 backend endpoint 或数据库 volume 混入应用配置。所有公开端口限定 loopback，
# 使本地学习环境不会意外暴露到局域网。
x-observability-budget:
  cpus: "8"
  memory: "12GiB"
  volumes: "20GiB"

services:
  collector:
    image: ${OTELCOL_CONTRIB_IMAGE}
    # 保持非 root UID；补充宿主机当前主组，使 filelog 能以只读方式读取 0640 JSONL。
    user: "10001:${OBSERVABILITY_LOG_GID:?set OBSERVABILITY_LOG_GID}"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      LANGFUSE_OTLP_AUTHORIZATION: ${LANGFUSE_OTLP_AUTHORIZATION:?set LANGFUSE_OTLP_AUTHORIZATION}
      LANGFUSE_OTEL_INGESTION_VERSION: ${LANGFUSE_OTEL_INGESTION_VERSION:?set LANGFUSE_OTEL_INGESTION_VERSION}
    ports:
      # 本地应用运行在宿主机时也只能通过 loopback 进入 Collector；业务进程绝不
      # 直接认识 Tempo/Loki/Prometheus/Grafana/Langfuse 地址。
      - host_ip: 127.0.0.1
        target: 4317
        published: 4317
      - host_ip: 127.0.0.1
        target: 4318
        published: 4318
      - host_ip: 127.0.0.1
        target: 13133
        published: 13133
      - host_ip: 127.0.0.1
        target: 8888
        published: 8888
    volumes:
      - type: bind
        source: ./collector/collector-grafana.yaml
        target: /etc/otelcol-contrib/config.yaml
        read_only: true
      # 宿主机应用写入项目内 ignored JSONL；Collector 只从挂载后的固定路径读取。
      - type: bind
        source: ../../resource/log/observability
        target: /var/log/longtermism
        read_only: true
      - type: volume
        source: collector-data
        target: /var/lib/otelcol/storage
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:13133/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512MiB

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    ports:
      - host_ip: 127.0.0.1
        target: 9090
        published: 9090
    volumes:
      - type: bind
        source: ./prometheus/prometheus.yaml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: volume
        source: prometheus-data
        target: /prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 1GiB

  loki:
    image: ${LOKI_IMAGE}
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - host_ip: 127.0.0.1
        target: 3100
        published: 3100
    volumes:
      - type: bind
        source: ./loki/loki.yaml
        target: /etc/loki/loki.yaml
        read_only: true
      - type: volume
        source: loki-data
        target: /loki
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1GiB

  tempo:
    image: ${TEMPO_IMAGE}
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - host_ip: 127.0.0.1
        target: 3200
        published: 3200
    volumes:
      - type: bind
        source: ./tempo/tempo.yaml
        target: /etc/tempo/tempo.yaml
        read_only: true
      - type: volume
        source: tempo-data
        target: /var/tempo
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1GiB

  grafana:
    image: ${GRAFANA_IMAGE}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    ports:
      - host_ip: 127.0.0.1
        target: 3000
        published: 3000
    volumes:
      - type: bind
        source: ./grafana/provisioning/datasources.yaml
        target: /etc/grafana/provisioning/datasources/datasources.yaml
        read_only: true
      - type: bind
        source: ./grafana/provisioning/dashboards.yaml
        target: /etc/grafana/provisioning/dashboards/dashboards.yaml
        read_only: true
      - type: bind
        source: ./grafana/dashboards/observability-overview.json
        target: /var/lib/grafana/dashboards/observability-overview.json
        read_only: true
      - type: bind
        source: ./grafana/alerts/observability.rules.yaml
        target: /etc/grafana/provisioning/alerting/observability.rules.yaml
        read_only: true
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512MiB

  langfuse-db:
    image: ${LANGFUSE_POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?set LANGFUSE_POSTGRES_PASSWORD}
    volumes:
      - type: volume
        source: langfuse-postgres-data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1GiB

  langfuse-clickhouse:
    image: ${LANGFUSE_CLICKHOUSE_IMAGE}
    volumes:
      - type: volume
        source: langfuse-clickhouse-data
        target: /var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: 2GiB

  langfuse-redis:
    image: ${LANGFUSE_REDIS_IMAGE}
    volumes:
      - type: volume
        source: langfuse-redis-data
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512MiB

  langfuse-web:
    image: ${LANGFUSE_IMAGE}
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:?set LANGFUSE_DATABASE_URL}
      DIRECT_URL: ${LANGFUSE_DIRECT_URL:?set LANGFUSE_DIRECT_URL}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:?set LANGFUSE_NEXTAUTH_URL}
      TELEMETRY_ENABLED: "false"
      REDIS_CONNECTION_STRING: ${LANGFUSE_REDIS_CONNECTION_STRING:?set LANGFUSE_REDIS_CONNECTION_STRING}
      CLICKHOUSE_URL: ${LANGFUSE_CLICKHOUSE_URL:?set LANGFUSE_CLICKHOUSE_URL}
      CLICKHOUSE_MIGRATION_URL: ${LANGFUSE_CLICKHOUSE_MIGRATION_URL:?set LANGFUSE_CLICKHOUSE_MIGRATION_URL}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    ports:
      - host_ip: 127.0.0.1
        target: 3000
        published: 3001
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1GiB

  langfuse-worker:
    image: ${LANGFUSE_WORKER_IMAGE}
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:?set LANGFUSE_DATABASE_URL}
      DIRECT_URL: ${LANGFUSE_DIRECT_URL:?set LANGFUSE_DIRECT_URL}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET}
      REDIS_CONNECTION_STRING: ${LANGFUSE_REDIS_CONNECTION_STRING:?set LANGFUSE_REDIS_CONNECTION_STRING}
      CLICKHOUSE_URL: ${LANGFUSE_CLICKHOUSE_URL:?set LANGFUSE_CLICKHOUSE_URL}
      CLICKHOUSE_MIGRATION_URL: ${LANGFUSE_CLICKHOUSE_MIGRATION_URL:?set LANGFUSE_CLICKHOUSE_MIGRATION_URL}
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node /app/worker-healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1GiB

volumes:
  collector-data: {}
  tempo-data: {}
  loki-data: {}
  prometheus-data: {}
  grafana-data: {}
  langfuse-postgres-data: {}
  langfuse-clickhouse-data: {}
  langfuse-redis-data: {}
