# Prometheus uses pull only. The application reaches the Collector via OTLP; this profile
# scrapes the Collector's Prometheus exporter and Collector self-telemetry, never remote_write.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: longtermism-application
    static_configs:
      - targets: ["collector:8889"]
  - job_name: otel-collector
    static_configs:
      - targets: ["collector:8888"]
