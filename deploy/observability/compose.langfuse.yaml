# 首次冷启动的独立 Langfuse profile。它刻意不引用 Collector 的 project API key，
# 从而允许操作者先创建 Langfuse 项目与 key，再启动完整观测 profile。
services:
  langfuse-db:
    image: ${LANGFUSE_POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?set LANGFUSE_POSTGRES_PASSWORD}
    volumes:
      - type: volume
        source: langfuse-postgres-data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1GiB

  langfuse-clickhouse:
    image: ${LANGFUSE_CLICKHOUSE_IMAGE}
    volumes:
      - type: volume
        source: langfuse-clickhouse-data
        target: /var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: 2GiB

  langfuse-redis:
    image: ${LANGFUSE_REDIS_IMAGE}
    volumes:
      - type: volume
        source: langfuse-redis-data
        target: /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512MiB

  langfuse-web:
    image: ${LANGFUSE_IMAGE}
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:?set LANGFUSE_DATABASE_URL}
      DIRECT_URL: ${LANGFUSE_DIRECT_URL:?set LANGFUSE_DIRECT_URL}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT}
      # Langfuse v3 uses this stable 32-byte key to encrypt persisted secrets. It must be
      # shared by web and worker, injected locally, and never rotated without a migration plan.
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:?set LANGFUSE_NEXTAUTH_URL}
      TELEMETRY_ENABLED: "false"
      REDIS_CONNECTION_STRING: ${LANGFUSE_REDIS_CONNECTION_STRING:?set LANGFUSE_REDIS_CONNECTION_STRING}
      CLICKHOUSE_URL: ${LANGFUSE_CLICKHOUSE_URL:?set LANGFUSE_CLICKHOUSE_URL}
      CLICKHOUSE_MIGRATION_URL: ${LANGFUSE_CLICKHOUSE_MIGRATION_URL:?set LANGFUSE_CLICKHOUSE_MIGRATION_URL}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    ports:
      - host_ip: 127.0.0.1
        target: 3000
        published: 3001
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1GiB

  langfuse-worker:
    image: ${LANGFUSE_WORKER_IMAGE}
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:?set LANGFUSE_DATABASE_URL}
      DIRECT_URL: ${LANGFUSE_DIRECT_URL:?set LANGFUSE_DIRECT_URL}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET}
      REDIS_CONNECTION_STRING: ${LANGFUSE_REDIS_CONNECTION_STRING:?set LANGFUSE_REDIS_CONNECTION_STRING}
      CLICKHOUSE_URL: ${LANGFUSE_CLICKHOUSE_URL:?set LANGFUSE_CLICKHOUSE_URL}
      CLICKHOUSE_MIGRATION_URL: ${LANGFUSE_CLICKHOUSE_MIGRATION_URL:?set LANGFUSE_CLICKHOUSE_MIGRATION_URL}
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node /app/worker-healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1GiB

volumes:
  langfuse-postgres-data: {}
  langfuse-clickhouse-data: {}
  langfuse-redis-data: {}
