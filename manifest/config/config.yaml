# GoFrame 应用配置。
# 生产环境通过环境变量覆盖（GF 支持配置项与环境变量映射）。
# 密钥严禁硬编码于此 —— 仅放非敏感默认值，敏感项走环境变量/密钥管理器。

server:
  address: ":8000"
  serverRoot: "resource/public"
  errorStack: false
  accessLogEnabled: true

logger:
  level: "info"
  stdout: true
  path: "resource/log/agent"

# 关系型数据库（遵循全局 rules/database/**：PostgreSQL + UUID + 软删除 + ORM 优先）。
# 本地和生产都通过环境变量覆盖，例如：
#   GF_DATABASE_DEFAULT_LINK="postgres://user:password@127.0.0.1:5432/ashjazz?sslmode=disable"
database:
  default:
    type: "pgsql"
    link: ""
    debug: true
    createdAt: "created_at"
    updatedAt: "updated_at"
    deletedAt: "deleted_at"

# Redis：会话状态、限流计数器、语义缓存（准备清单 §12）。
redis:
  default:
    address: "127.0.0.1:6379"
    db: 0

# AI 框架内核配置（pkg/ai 消费）。按 provider 分组，支持多 provider 故障切换（§10）。
ai:
  llm:
    defaultProvider: "openai"
    # 单次 LLM 调用默认超时（§ai/integration.md：默认 60s）。
    timeout: "60s"
    retry:
      max: 2
      backoffMs: 1000
  ratelimit:
    # 全局 + 用户 + provider 三级限流默认值（§11）。
    globalQps: 100
    userPerMin: 20
  eval:
    # 评估门禁阈值（§6）：指标恶化超过阈值即拦截 PR 合并。
    faithfulnessDropPct: 2

# Observability v1：默认只启用本地/离线验证。
# 真实平台 smoke 必须显式 opt-in，并通过环境变量或密钥管理器注入 endpoint 与凭据。
observability:
  enabled: false
  serviceName: "ashjazz-aiagent"
  environment: "local"
  smoke:
    # 真实平台 smoke 默认关闭，不进入 `go test ./...` 或默认 eval/obs smoke 门禁。
    # 只有本开关为 true，且 endpoint 与凭据均由环境变量/密钥管理器提供时，才允许外连。
    enabled: false
    # provider 是低敏平台类型标识，例如 "otlp" 或 "langfuse"；不要在这里写 SDK 专属对象。
    provider: ""
    # endpoint 没有降级默认值，禁止在源码里配置真实 collector/Langfuse URL。
    # 推荐生产或手动 smoke 时通过环境变量覆盖：
    #   GF_OBSERVABILITY_SMOKE_ENDPOINT="https://collector.example.com"
    endpoint: ""
    # 凭据字段只保留空占位，真实值必须来自环境变量或密钥管理器，严禁提交到源码。
    # 例如：
    #   GF_OBSERVABILITY_SMOKE_PUBLICKEY="..."
    #   GF_OBSERVABILITY_SMOKE_SECRETKEY="..."
    #   GF_OBSERVABILITY_SMOKE_APIKEY="..."
    publicKey: ""
    secretKey: ""
    apiKey: ""
  privacy:
    allowRawContent: false
