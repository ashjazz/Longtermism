# GoFrame 应用配置。
# 生产环境通过环境变量覆盖（GF 支持配置项与环境变量映射）。
# 密钥严禁硬编码于此 —— 仅放非敏感默认值，敏感项走环境变量/密钥管理器。

server:
  address: ":8000"
  serverRoot: "resource/public"
  errorStack: false
  accessLogEnabled: true

# 应用运行环境与调试状态。观测装配会读取同一环境身份，避免 production 被错误地当成
# local 而放宽 payload 或明文传输门禁。
app:
  environment: "local"
  is_debug: true

logger:
  level: "info"
  stdout: true
  path: "resource/log/agent"

# 关系型数据库（遵循全局 rules/database/**：PostgreSQL + UUID + 软删除 + ORM 优先）。
# 本地和生产都通过环境变量覆盖，例如：
#   GF_DATABASE_DEFAULT_LINK="postgres://user:password@127.0.0.1:5432/longtermism?sslmode=disable"
database:
  default:
    type: "pgsql"
    link: ""
    debug: true
    createdAt: "created_at"
    updatedAt: "updated_at"
    deletedAt: "deleted_at"

# Redis：会话状态、限流计数器、语义缓存（准备清单 §12）。
redis:
  default:
    address: "127.0.0.1:6379"
    db: 0

# AI 框架内核配置（pkg/ai 消费）。按 provider 分组，支持多 provider 故障切换（§10）。
ai:
  # chat 默认关闭：未显式提供 provider 的 URL、模型与环境变量名之前，不允许服务
  # 启动后意外调用模型或读取生产凭据。
  chat:
    enabled: false
  llm:
    default_provider: "openai"
    providers:
      openai:
        # 仅声明注入名称，禁止把 URL、API key 或模型凭据写进受版本管理配置。
        base_url_env: "OPENAI_BASE_URL"
        api_key_env: "OPENAI_API_KEY"
        default_model: ""
    # 单次 LLM 调用默认超时（§ai/integration.md：默认 60s）。
    timeout: "60s"
    retry:
      max: 2
      backoffMs: 1000
  ratelimit:
    # 全局 + 用户 + provider 三级限流默认值（§11）。
    globalQps: 100
    userPerMin: 20
  eval:
    # 评估门禁阈值（§6）：指标恶化超过阈值即拦截 PR 合并。
    faithfulnessDropPct: 2

# 应用只认识自身遥测和唯一的 App -> Collector 出口。Tempo、Loki、Prometheus、
# Grafana、SigNoz 与 Langfuse 的地址属于 Collector/部署配置，不能出现在这里。
observability:
  enabled: false
  # disabled 状态必须对应 noop，避免 enabled/mode 出现两条可解释路径。
  mode: "noop"
  resource:
    service_name: "longtermism"
    service_version: "dev"
  collector:
    # 切换到 collector mode 时，endpoint 仍只能是 Collector；默认留空以保证零网络。
    protocol: "grpc"
    endpoint: ""
    insecure: false
    headers_env: "OTEL_EXPORTER_OTLP_HEADERS"
  signals:
    traces_enabled: false
    metrics_enabled: false
    logs_transport: "glog_file"
  tracing:
    sampling_ratio: 1.0
  payload:
    mode: "metadata_only"
    raw_content_enabled: false
  sensitive_data:
    on_match: "redact"
  smoke:
    # infra-smoke route 默认不注册；真实后端扫描另由命令层显式 opt-in。
    enabled: false
